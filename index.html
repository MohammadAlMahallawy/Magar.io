<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Agar.io Clone</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #f2f6fa; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 10px; left: 10px; color: #333;
    font-family: Arial, sans-serif; font-size: 14px;
    background: rgba(255,255,255,0.75); padding: 6px 10px; border-radius: 4px;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="hud">FPS: <span id="fps">0</span> | Mass: <span id="massDisplay">20</span></div>
<script>
// ============================================================
// PHASE 0 + PHASE 1 REFERENCE IMPLEMENTATION
// Skeleton + World/Camera/Movement. Everything after this
// point (food, bots, split, viruses, zoom/leaderboard) is
// built by extending this same file, phase by phase.
// ============================================================

// ---------- Global constants (single source of truth) ----------
const WORLD_WIDTH = 5000;
const WORLD_HEIGHT = 5000;
const GRID_SIZE = 50;
const BASE_SPEED = 260;        // px/sec at REFERENCE_MASS
const REFERENCE_MASS = 20;     // mass at which BASE_SPEED applies
const SPEED_FALLOFF = 0.25;    // gentler slowdown keeps large blobs competitive
const MASS_RADIUS_SCALE = 6;   // radius = sqrt(mass/PI) * this
const START_MASS = 20;
const FOOD_COUNT = 500;
const FOOD_RADIUS = 6;         // world units
const FOOD_MASS_GAIN = 1;      // mass added per food eaten
const FOOD_COLORS = ['#ff3b8d', '#8e44ff', '#b7e532', '#19d3ff', '#ff9f1c', '#ff4d4d', '#3388ff'];
const BOT_COUNT = 14;
const BOT_DIFFICULTY_WEIGHTS = { easy: 0.50, medium: 0.35, hard: 0.15 };
const BOT_DETECTION_RADIUS = 600;
const BOT_EAT_MARGIN = 1.25;
const BOT_REEVAL_INTERVAL = { easy: 1.0, medium: 0.5, hard: 0.2 };
const BOT_BORED_AFTER = [8, 15];
const BOT_BORED_COOLDOWN = [10, 20];
const BOT_PREDICTION_TIME = { easy: 0.15, medium: 0.35, hard: 0.65 };
const BOT_BOUNDARY_MARGIN = 180;
const SPLIT_MIN_MASS = 40;
const SPLIT_KICK_SPEED = 500;
const SPLIT_KICK_DECAY = 3.0;
const MERGE_COOLDOWN = 15;       // seconds before split pieces can merge again
const EJECT_MASS_COST = 14;
const EJECTED_MASS_MASS = 12;
const EJECTED_MASS_SPEED = 700;
const EJECTED_MASS_DECAY = 4.0;

// ---------- Canvas setup ----------
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  // NOTE: canvas.width/height is the drawing buffer.
  // canvas.style.width/height is the CSS box size.
  // Both must be set or the canvas renders blurry/stretched.
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ---------- Player (plain object, no classes) ----------
const player = {
  id: 'player_1',
  ownerId: 'player',
  x: WORLD_WIDTH / 2,
  y: WORLD_HEIGHT / 2,
  mass: START_MASS,
  radius: 0,
  color: '#3388ff',
  borderColor: '#1a5fb4',
  vx: 0,
  vy: 0,
  mergeLockUntil: 0,
  isBot: false
};
const playerBlobs = [player];
const bots = [];
const ejectedMass = [];
let nextBlobId = 1;
let gameTime = 0;

function updateRadiusFromMass(obj) {
  // Area scales with mass, not radius directly -> sqrt.
  obj.radius = Math.sqrt(obj.mass / Math.PI) * MASS_RADIUS_SCALE;
}
updateRadiusFromMass(player);

function activeBlobs() {
  return playerBlobs.concat(bots);
}

function getTotalMass(ownerId) {
  let total = 0;
  for (const blob of activeBlobs()) {
    if (blob.ownerId === ownerId) total += blob.mass;
  }
  return total;
}

function randomRange(min, max) {
  return min + Math.random() * (max - min);
}

function randomBotDifficulty() {
  const roll = Math.random();
  if (roll < BOT_DIFFICULTY_WEIGHTS.easy) return 'easy';
  if (roll < BOT_DIFFICULTY_WEIGHTS.easy + BOT_DIFFICULTY_WEIGHTS.medium) return 'medium';
  return 'hard';
}

function randomDuration(range) {
  return randomRange(range[0], range[1]);
}

function randomSpawnPosition(radius) {
  return {
    x: radius + Math.random() * (WORLD_WIDTH - radius * 2),
    y: radius + Math.random() * (WORLD_HEIGHT - radius * 2)
  };
}

function createBot(index) {
  const difficulty = randomBotDifficulty();
  const mass = randomRange(14, 42);
  const bot = {
    id: 'bot_' + index,
    ownerId: 'bot_' + index,
    x: 0,
    y: 0,
    mass,
    radius: 0,
    color: FOOD_COLORS[index % FOOD_COLORS.length],
    borderColor: '#24506f',
    vx: 0,
    vy: 0,
    mergeLockUntil: 0,
    isBot: true,
    state: 'SEEKING_FOOD',
    difficulty,
    targetId: null,
    nextEvalAt: 0,
    boredUntil: 0,
    boredTargetId: null,
    huntStartedAt: 0,
    boredAfter: randomDuration(BOT_BORED_AFTER),
    wanderX: 0,
    wanderY: 0,
    targetX: 0,
    targetY: 0,
    canSplit: difficulty !== 'easy',
    canEject: difficulty !== 'easy'
  };
  updateRadiusFromMass(bot);

  let position = randomSpawnPosition(bot.radius);
  for (let attempt = 0; attempt < 40; attempt++) {
    const tooClose = activeBlobs().some((blob) =>
      Math.hypot(position.x - blob.x, position.y - blob.y) < bot.radius + blob.radius + 100
    );
    if (!tooClose) break;
    position = randomSpawnPosition(bot.radius);
  }
  bot.x = position.x;
  bot.y = position.y;
  bot.wanderX = bot.x;
  bot.wanderY = bot.y;
  return bot;
}

// ---------- Food ----------
const food = [];

for (let i = 0; i < BOT_COUNT; i++) {
  bots.push(createBot(i + 1));
}

function randomFoodColor() {
  return FOOD_COLORS[Math.floor(Math.random() * FOOD_COLORS.length)];
}

function randomFoodPosition() {
  const maxX = WORLD_WIDTH - FOOD_RADIUS;
  const maxY = WORLD_HEIGHT - FOOD_RADIUS;
  return {
    x: FOOD_RADIUS + Math.random() * (maxX - FOOD_RADIUS),
    y: FOOD_RADIUS + Math.random() * (maxY - FOOD_RADIUS)
  };
}

function spawnFood() {
  let position = randomFoodPosition();
  for (let attempt = 0; attempt < 20; attempt++) {
    if (activeBlobs().every((blob) =>
      Math.hypot(position.x - blob.x, position.y - blob.y) >= blob.radius + FOOD_RADIUS
    )) {
      break;
    }
    position = randomFoodPosition();
  }
  food.push({ x: position.x, y: position.y, radius: FOOD_RADIUS, color: randomFoodColor() });
}

for (let i = 0; i < FOOD_COUNT; i++) {
  spawnFood();
}

function updateFood() {
  for (let i = food.length - 1; i >= 0; i--) {
    const item = food[i];
    const eater = activeBlobs().find((blob) =>
      Math.hypot(item.x - blob.x, item.y - blob.y) < blob.radius + item.radius
    );
    if (eater) {
      eater.mass += FOOD_MASS_GAIN;
      updateRadiusFromMass(eater);
      food.splice(i, 1);
      spawnFood();
    }
  }
}

// ---------- Mouse tracking (screen space) ----------
const mouse = { x: canvas.width / 2, y: canvas.height / 2 };
window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
});

// ---------- Camera ----------
// camera.x / camera.y are WORLD coordinates of whatever is at
// the center of the screen. camera.zoom is a scale factor.
const camera = { x: player.x, y: player.y, zoom: 1 };

// THE single conversion function. Every draw call must go through this.
function worldToScreen(wx, wy) {
  return {
    x: (wx - camera.x) * camera.zoom + canvas.width / 2,
    y: (wy - camera.y) * camera.zoom + canvas.height / 2
  };
}

function screenToWorld(sx, sy) {
  return {
    x: (sx - canvas.width / 2) / camera.zoom + camera.x,
    y: (sy - canvas.height / 2) / camera.zoom + camera.y
  };
}

// ---------- Movement, bots, split, and ejection ----------
function clampBlobToWorld(blob) {
  blob.x = Math.max(blob.radius, Math.min(WORLD_WIDTH - blob.radius, blob.x));
  blob.y = Math.max(blob.radius, Math.min(WORLD_HEIGHT - blob.radius, blob.y));
}

function applyKick(blob, dt) {
  const decay = Math.max(0, 1 - SPLIT_KICK_DECAY * dt);
  blob.x += blob.vx * dt;
  blob.y += blob.vy * dt;
  blob.vx *= decay;
  blob.vy *= decay;
}

function playerDirection(blob) {
  const target = screenToWorld(mouse.x, mouse.y);
  const dx = target.x - blob.x;
  const dy = target.y - blob.y;
  const distance = Math.hypot(dx, dy);
  return distance > 1 ? { x: dx / distance, y: dy / distance } : { x: 0, y: 0 };
}

function moveBlob(blob, direction, dt) {
  applyKick(blob, dt);
  const speed = BASE_SPEED * Math.pow(REFERENCE_MASS / Math.max(1, blob.mass), SPEED_FALLOFF);
  blob.x += direction.x * speed * dt;
  blob.y += direction.y * speed * dt;
  clampBlobToWorld(blob);
}

function updatePlayer(dt) {
  for (const blob of playerBlobs) {
    moveBlob(blob, playerDirection(blob), dt);
  }

  const focus = playerBlobs[0] || player;
  camera.x = focus.x;
  camera.y = focus.y;
}

function findBlobById(id) {
  return activeBlobs().find((blob) => blob.id === id) || null;
}

function chooseWanderPoint(bot) {
  const angle = Math.random() * Math.PI * 2;
  const distance = randomRange(BOT_DETECTION_RADIUS * 0.35, BOT_DETECTION_RADIUS);
  bot.wanderX = Math.max(bot.radius, Math.min(WORLD_WIDTH - bot.radius, bot.x + Math.cos(angle) * distance));
  bot.wanderY = Math.max(bot.radius, Math.min(WORLD_HEIGHT - bot.radius, bot.y + Math.sin(angle) * distance));
}

function blobsNear(bot) {
  return activeBlobs().filter((blob) => {
    if (blob === bot || blob.ownerId === bot.ownerId) return false;
    return Math.hypot(blob.x - bot.x, blob.y - bot.y) <= BOT_DETECTION_RADIUS;
  });
}

function reevaluateBot(bot, now) {
  if (now < bot.nextEvalAt) return;
  bot.nextEvalAt = now + BOT_REEVAL_INTERVAL[bot.difficulty];

  const nearby = blobsNear(bot);
  const threats = nearby
    .filter((blob) => blob.mass > bot.mass * BOT_EAT_MARGIN)
    .sort((a, b) => {
      const distanceA = Math.hypot(a.x - bot.x, a.y - bot.y);
      const distanceB = Math.hypot(b.x - bot.x, b.y - bot.y);
      return (distanceA / a.mass) - (distanceB / b.mass);
    });
  const threat = threats[0];
  if (threat) {
    bot.state = 'FLEEING';
    bot.targetId = threat.id;
    bot.targetX = threat.x;
    bot.targetY = threat.y;
    return;
  }

  const currentTarget = bot.targetId ? findBlobById(bot.targetId) : null;
  if (bot.state === 'HUNTING' && currentTarget &&
      now - bot.huntStartedAt >= bot.boredAfter) {
    bot.state = 'BORED';
    bot.boredTargetId = bot.targetId;
    bot.targetId = null;
    bot.boredUntil = now + randomDuration(BOT_BORED_COOLDOWN);
    return;
  }

  if (now < bot.boredUntil) {
    bot.state = 'BORED';
    bot.targetId = null;
    return;
  }
  const blockedTargetId = bot.boredTargetId;
  bot.boredTargetId = null;

  const prey = nearby
    .filter((blob) =>
      blob.id !== blockedTargetId &&
      blob.mass < bot.mass / BOT_EAT_MARGIN
    )
    .sort((a, b) => {
      const score = (blob) => {
        const distance = Math.hypot(blob.x - bot.x, blob.y - bot.y);
        return blob.mass / Math.max(100, distance);
      };
      return score(b) - score(a);
    })[0];
  if (prey) {
    if (bot.targetId !== prey.id) {
      bot.huntStartedAt = now;
      bot.boredAfter = randomDuration(BOT_BORED_AFTER);
    }
    bot.state = 'HUNTING';
    bot.targetId = prey.id;
    bot.targetX = prey.x;
    bot.targetY = prey.y;
  } else {
    bot.state = now < bot.boredUntil ? 'BORED' : 'SEEKING_FOOD';
    bot.targetId = null;
    bot.targetX = 0;
    bot.targetY = 0;
  }
}

function addDirection(first, second, weight) {
  return {
    x: first.x + second.x * weight,
    y: first.y + second.y * weight
  };
}

function normalizeDirection(direction) {
  const length = Math.hypot(direction.x, direction.y);
  return length > 0.001 ? { x: direction.x / length, y: direction.y / length } : { x: 0, y: 0 };
}

function botDirection(bot) {
  const target = bot.targetId ? findBlobById(bot.targetId) : null;
  if (bot.state === 'FLEEING' && target) {
    const threatDirection = normalizeDirection({ x: bot.x - target.x, y: bot.y - target.y });
    const boundaryDirection = {
      x: bot.x < BOT_BOUNDARY_MARGIN ? 1 : bot.x > WORLD_WIDTH - BOT_BOUNDARY_MARGIN ? -1 : 0,
      y: bot.y < BOT_BOUNDARY_MARGIN ? 1 : bot.y > WORLD_HEIGHT - BOT_BOUNDARY_MARGIN ? -1 : 0
    };
    return normalizeDirection(addDirection(threatDirection, boundaryDirection, 2));
  }
  if (bot.state === 'HUNTING' && target) {
    const prediction = BOT_PREDICTION_TIME[bot.difficulty];
    const predictedTarget = {
      x: target.x + target.vx * prediction,
      y: target.y + target.vy * prediction
    };
    bot.targetX = predictedTarget.x;
    bot.targetY = predictedTarget.y;
    return normalizeDirection({ x: predictedTarget.x - bot.x, y: predictedTarget.y - bot.y });
  }

  let nearestFood = null;
  let bestFoodScore = -Infinity;
  for (const item of food) {
    const distance = Math.hypot(item.x - bot.x, item.y - bot.y);
    if (distance <= BOT_DETECTION_RADIUS) {
      const score = (BOT_DETECTION_RADIUS - distance) / BOT_DETECTION_RADIUS;
      if (score > bestFoodScore) {
        bestFoodScore = score;
        nearestFood = item;
      }
    }
  }
  if (nearestFood) {
    const boundaryDirection = {
      x: bot.x < BOT_BOUNDARY_MARGIN ? 1 : bot.x > WORLD_WIDTH - BOT_BOUNDARY_MARGIN ? -1 : 0,
      y: bot.y < BOT_BOUNDARY_MARGIN ? 1 : bot.y > WORLD_HEIGHT - BOT_BOUNDARY_MARGIN ? -1 : 0
    };
    return normalizeDirection(addDirection(
      { x: nearestFood.x - bot.x, y: nearestFood.y - bot.y },
      boundaryDirection,
      BOT_BOUNDARY_MARGIN
    ));
  }

  if (Math.hypot(bot.wanderX - bot.x, bot.wanderY - bot.y) < 20) chooseWanderPoint(bot);
  const wanderDirection = { x: bot.wanderX - bot.x, y: bot.wanderY - bot.y };
  const boundaryDirection = {
    x: bot.x < BOT_BOUNDARY_MARGIN ? 1 : bot.x > WORLD_WIDTH - BOT_BOUNDARY_MARGIN ? -1 : 0,
    y: bot.y < BOT_BOUNDARY_MARGIN ? 1 : bot.y > WORLD_HEIGHT - BOT_BOUNDARY_MARGIN ? -1 : 0
  };
  return normalizeDirection(addDirection(wanderDirection, boundaryDirection, BOT_BOUNDARY_MARGIN));
}

function grantDeveloperMass() {
  player.mass += 100;
  updateRadiusFromMass(player);
}

function updateBots(dt, now) {
  for (const bot of bots) {
    reevaluateBot(bot, now);
    moveBlob(bot, botDirection(bot), dt);
  }
}

function splitBlob(blob, direction, now) {
  if (blob.mass < SPLIT_MIN_MASS) return null;
  if (blob.ownerId == null) blob.ownerId = blob.isBot ? blob.id : 'player';

  const halfMass = blob.mass / 2;
  blob.mass = halfMass;
  blob.mergeLockUntil = now + MERGE_COOLDOWN;
  updateRadiusFromMass(blob);

  const child = {
    id: (blob.isBot ? blob.ownerId : 'player') + '_piece_' + (nextBlobId++),
    ownerId: blob.ownerId,
    x: blob.x + direction.x * (blob.radius + halfMass),
    y: blob.y + direction.y * (blob.radius + halfMass),
    mass: halfMass,
    radius: 0,
    color: blob.color,
    borderColor: blob.borderColor,
    vx: direction.x * SPLIT_KICK_SPEED,
    vy: direction.y * SPLIT_KICK_SPEED,
    isBot: blob.isBot,
    mergeLockUntil: now + MERGE_COOLDOWN
  };
  updateRadiusFromMass(child);
  clampBlobToWorld(child);
  return child;
}

function splitPlayer() {
  const additions = [];
  for (const blob of playerBlobs) {
    const child = splitBlob(blob, playerDirection(blob), gameTime);
    if (child) additions.push(child);
  }
  playerBlobs.push(...additions);
}

function ejectFromBlob(blob, direction) {
  if (blob.mass <= EJECT_MASS_COST + EJECTED_MASS_MASS) return;
  blob.mass -= EJECT_MASS_COST;
  updateRadiusFromMass(blob);
  const radius = Math.sqrt(EJECTED_MASS_MASS / Math.PI) * MASS_RADIUS_SCALE;
  const item = {
    x: blob.x + direction.x * (blob.radius + radius),
    y: blob.y + direction.y * (blob.radius + radius),
    vx: direction.x * EJECTED_MASS_SPEED,
    vy: direction.y * EJECTED_MASS_SPEED,
    mass: EJECTED_MASS_MASS,
    radius,
    ownerId: blob.ownerId
  };
  ejectedMass.push(item);
}

function ejectPlayerMass() {
  for (const blob of playerBlobs) {
    ejectFromBlob(blob, playerDirection(blob));
  }
}

window.addEventListener('keydown', (event) => {
  if (event.code === 'Space') {
    event.preventDefault();
    splitPlayer();
  } else if (event.key && event.key.toLowerCase() === 'w') {
    ejectPlayerMass();
  } else if (event.key && event.key.toLowerCase() === 'x') {
    grantDeveloperMass();
  }
});

function updateEjectedMass(dt) {
  const decay = Math.max(0, 1 - EJECTED_MASS_DECAY * dt);
  for (const item of ejectedMass) {
    item.x += item.vx * dt;
    item.y += item.vy * dt;
    item.vx *= decay;
    item.vy *= decay;
    item.x = Math.max(item.radius, Math.min(WORLD_WIDTH - item.radius, item.x));
    item.y = Math.max(item.radius, Math.min(WORLD_HEIGHT - item.radius, item.y));
  }
}

function resolveEjectedMass() {
  for (let i = ejectedMass.length - 1; i >= 0; i--) {
    const item = ejectedMass[i];
    const eater = activeBlobs().find((blob) =>
      Math.hypot(item.x - blob.x, item.y - blob.y) < blob.radius + item.radius &&
      (blob.ownerId !== item.ownerId || Math.hypot(item.x - blob.x, item.y - blob.y) > blob.radius)
    );
    if (eater) {
      eater.mass += item.mass;
      updateRadiusFromMass(eater);
      ejectedMass.splice(i, 1);
    }
  }
}

function removeBlob(blob) {
  const collection = blob.isBot ? bots : playerBlobs;
  const index = collection.indexOf(blob);
  if (index !== -1) collection.splice(index, 1);
}

function mergeBlobs(first, second) {
  const totalMass = first.mass + second.mass;
  first.x = (first.x * first.mass + second.x * second.mass) / totalMass;
  first.y = (first.y * first.mass + second.y * second.mass) / totalMass;
  first.mass = totalMass;
  first.vx = 0;
  first.vy = 0;
  first.mergeLockUntil = 0;
  updateRadiusFromMass(first);
  removeBlob(second);
}

function resolveMergeGroups() {
  const eligible = activeBlobs().filter((blob) => gameTime >= blob.mergeLockUntil);
  const visited = new Set();

  for (const start of eligible) {
    if (visited.has(start.id)) continue;

    const cluster = [];
    const queue = [start];
    visited.add(start.id);
    while (queue.length > 0) {
      const current = queue.shift();
      cluster.push(current);
      for (const candidate of eligible) {
        if (visited.has(candidate.id) || candidate.ownerId !== start.ownerId) continue;
        const distance = Math.hypot(current.x - candidate.x, current.y - candidate.y);
        if (distance < current.radius + candidate.radius) {
          visited.add(candidate.id);
          queue.push(candidate);
        }
      }
    }

    for (let i = 1; i < cluster.length; i++) {
      mergeBlobs(cluster[0], cluster[i]);
    }
  }
}

function resolveBlobCollisions() {
  resolveMergeGroups();
  const blobs = activeBlobs();
  for (let i = 0; i < blobs.length; i++) {
    const first = blobs[i];
    if (!activeBlobs().includes(first)) continue;
    for (let j = i + 1; j < blobs.length; j++) {
      const second = blobs[j];
      if (!activeBlobs().includes(second)) continue;
      const distance = Math.hypot(first.x - second.x, first.y - second.y);
      if (first.ownerId === second.ownerId) {
        if (gameTime >= first.mergeLockUntil && gameTime >= second.mergeLockUntil) continue;
        if (distance < first.radius + second.radius) {
          const minimumDistance = first.radius + second.radius;
          const separation = Math.max(0.001, minimumDistance - distance);
          const normalX = distance > 0 ? (second.x - first.x) / distance : 1;
          const normalY = distance > 0 ? (second.y - first.y) / distance : 0;
          first.x -= normalX * separation / 2;
          first.y -= normalY * separation / 2;
          second.x += normalX * separation / 2;
          second.y += normalY * separation / 2;
          clampBlobToWorld(first);
          clampBlobToWorld(second);
        }
        continue;
      }

      if (distance >= Math.max(first.radius, second.radius)) continue;
      const larger = first.mass > second.mass * BOT_EAT_MARGIN ? first :
        second.mass > first.mass * BOT_EAT_MARGIN ? second : null;
      if (!larger) continue;
      const smaller = larger === first ? second : first;
      larger.mass += smaller.mass;
      updateRadiusFromMass(larger);
      removeBlob(smaller);
    }
  }
}

// ---------- Rendering ----------
function drawGrid() {
  ctx.strokeStyle = '#dce8f0';
  ctx.lineWidth = 1;

  const halfW = canvas.width / 2 / camera.zoom;
  const halfH = canvas.height / 2 / camera.zoom;
  const startX = Math.floor((camera.x - halfW) / GRID_SIZE) * GRID_SIZE;
  const endX = camera.x + halfW;
  const startY = Math.floor((camera.y - halfH) / GRID_SIZE) * GRID_SIZE;
  const endY = camera.y + halfH;

  ctx.beginPath();
  for (let gx = startX; gx <= endX; gx += GRID_SIZE) {
    const p1 = worldToScreen(gx, startY);
    const p2 = worldToScreen(gx, endY);
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
  }
  for (let gy = startY; gy <= endY; gy += GRID_SIZE) {
    const p1 = worldToScreen(startX, gy);
    const p2 = worldToScreen(endX, gy);
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
  }
  ctx.stroke();
}

function drawWorldBoundary() {
  const topLeft = worldToScreen(0, 0);
  const bottomRight = worldToScreen(WORLD_WIDTH, WORLD_HEIGHT);
  ctx.save();
  ctx.strokeStyle = '#b0c4d4';
  ctx.lineWidth = 4;
  ctx.setLineDash([10, 6]);
  ctx.strokeRect(
    topLeft.x, topLeft.y,
    bottomRight.x - topLeft.x, bottomRight.y - topLeft.y
  );
  ctx.restore();
}

function drawBlob(obj) {
  const s = worldToScreen(obj.x, obj.y);
  const r = obj.radius * camera.zoom;
  // Cull off-screen objects cheaply (helps once food/bots exist).
  if (s.x + r < 0 || s.x - r > canvas.width || s.y + r < 0 || s.y - r > canvas.height) return;

  ctx.beginPath();
  ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
  ctx.fillStyle = obj.color;
  ctx.fill();
  ctx.lineWidth = Math.max(2, r * 0.08);
  ctx.strokeStyle = obj.borderColor;
  ctx.stroke();
}

function drawFood() {
  for (const item of food) {
    const s = worldToScreen(item.x, item.y);
    const r = item.radius * camera.zoom;
    if (s.x + r < 0 || s.x - r > canvas.width || s.y + r < 0 || s.y - r > canvas.height) continue;

    ctx.beginPath();
    ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
    ctx.fillStyle = item.color;
    ctx.fill();
  }
}

function drawEjectedMass() {
  for (const item of ejectedMass) {
    const s = worldToScreen(item.x, item.y);
    const r = item.radius * camera.zoom;
    if (s.x + r < 0 || s.x - r > canvas.width || s.y + r < 0 || s.y - r > canvas.height) continue;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
    ctx.fillStyle = '#65c466';
    ctx.fill();
    ctx.strokeStyle = '#31843a';
    ctx.lineWidth = Math.max(1, r * 0.08);
    ctx.stroke();
  }
}

function render() {
  ctx.fillStyle = '#f2f6fa';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawGrid();
  drawWorldBoundary();
  drawFood();
  drawEjectedMass();
  for (const bot of bots) drawBlob(bot);
  for (const blob of playerBlobs) drawBlob(blob);
}

// ---------- Game loop (rAF + delta time, never setInterval) ----------
let lastTime = performance.now();
let fpsAccumFrames = 0, fpsAccumTime = 0;
const fpsEl = document.getElementById('fps');
const massEl = document.getElementById('massDisplay');

function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1); // clamp to avoid huge jumps on tab-switch
  lastTime = now;

  updatePlayer(dt);
  updateBots(dt, gameTime);
  updateFood();
  updateEjectedMass(dt);
  resolveEjectedMass();
  resolveBlobCollisions();
  render();

  fpsAccumFrames++;
  fpsAccumTime += dt;
  if (fpsAccumTime >= 0.5) {
    fpsEl.textContent = Math.round(fpsAccumFrames / fpsAccumTime);
    massEl.textContent = Math.round(getTotalMass('player'));
    fpsAccumFrames = 0;
    fpsAccumTime = 0;
  }

  gameTime += dt;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
